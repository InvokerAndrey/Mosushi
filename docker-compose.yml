services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/db:/app/db
      - ./backend/media:/app/media
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
